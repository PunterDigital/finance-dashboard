appId: com.punterdigital.financedashboard
productName: Finance Dashboard
copyright: Copyright © 2026 Punter Digital Limited

directories:
  output: dist-release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# Releases are created by .github/workflows/release.yml (electron-builder runs with --publish never).
# This block only tells electron-updater where to look (#3353): it writes resources/app-update.yml into
# the app and latest.yml (+ the installer's .blockmap) next to the installer, which the release uploads.
publish:
  provider: github
  owner: PunterDigital
  repo: finance-dashboard

win:
  artifactName: Finance-Dashboard-Setup-${version}.${ext}
  # No certificate: this only stamps the icon and version info into the .exe (rcedit), nothing is signed.
  signAndEditExecutable: true
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Never delete the user's finance database on uninstall.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [universal]
  artifactName: Finance-Dashboard-${version}-universal.${ext}
  category: public.app-category.finance
  # No Developer ID: scripts/after-pack.cjs ad-hoc signs the bundle instead (Apple Silicon won't run an
  # app with a broken signature). Hardened runtime needs a real identity.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

asar: true
afterPack: scripts/after-pack.cjs

# No native modules (SQLite is Node's built-in node:sqlite), so nothing to rebuild.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
