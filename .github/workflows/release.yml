name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package.json version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: |
          for app in dist-release/mac-universal/*.app; do codesign --verify --deep --strict --verbose=2 "$app"; done
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            dist-release/*.exe
            dist-release/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Finance Dashboard ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
